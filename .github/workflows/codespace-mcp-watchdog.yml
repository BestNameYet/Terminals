name: Codespace MCP watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespace-mcp-watchdog
  cancel-in-progress: false

jobs:
  ensure-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      CODESPACE_NAME: ${{ vars.MCP_CODESPACE_NAME || 'shiny-robot' }}
      MCP_URL: ${{ vars.MCP_SERVER_URL || 'https://shiny-robot-3000.app.github.dev/mcp' }}
    steps:
      - name: Check credential and Codespace status
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Configure repository secret CODESPACES_PAT with Codespaces management access."
            exit 1
          fi
          state="$(gh api "user/codespaces/${CODESPACE_NAME}" --jq '.state')"
          echo "Codespace ${CODESPACE_NAME}: ${state}"
          if [[ "${state}" != "Available" ]]; then
            echo "Requesting Codespace start"
            gh api --method POST "user/codespaces/${CODESPACE_NAME}/start" >/dev/null
          fi
          for attempt in {1..18}; do
            state="$(gh api "user/codespaces/${CODESPACE_NAME}" --jq '.state')"
            [[ "${state}" == "Available" ]] && break
            sleep 10
          done
          if [[ "${state}" != "Available" ]]; then
            echo "::error::Codespace did not become available: ${state}"
            exit 1
          fi
      - name: Check MCP service and restart if needed
        shell: bash
        run: |
          set -euo pipefail
          # A protected MCP endpoint may respond 401; that still proves the HTTP service is responding.
          code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 "${MCP_URL}" || true)"
          if [[ "${code}" == "200" || "${code}" == "400" || "${code}" == "401" || "${code}" == "405" ]]; then
            echo "MCP endpoint responding: HTTP ${code}"
            exit 0
          fi
          echo "MCP endpoint not healthy (HTTP ${code}); starting server inside Codespace"
          gh codespace ssh -c "${CODESPACE_NAME}" -- "bash -lc 'cd /workspaces/Terminals/workspaces/codespace-terminal-mcp && (pgrep -f "node http-server.mjs" >/dev/null || (nohup env PORT=3000 node http-server.mjs >/tmp/terminal-mcp.log 2>&1 </dev/null &))'"
          sleep 10
          code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 "${MCP_URL}" || true)"
          if [[ "${code}" != "200" && "${code}" != "400" && "${code}" != "401" && "${code}" != "405" ]]; then
            echo "::error::MCP endpoint remains unavailable: HTTP ${code}"
            exit 1
          fi
          echo "MCP endpoint restored: HTTP ${code}"
