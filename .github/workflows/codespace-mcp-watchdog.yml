name: Codespace MCP watchdog

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespace-mcp-watchdog
  cancel-in-progress: false

jobs:
  ensure-codespace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
      CODESPACE_NAME: ${{ vars.MCP_CODESPACE_NAME || 'shiny-robot' }}
    steps:
      - name: Start Codespace
        shell: bash
        run: |
          set -euo pipefail
          gh codespace start -c "${CODESPACE_NAME}"
