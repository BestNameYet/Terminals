name: Issue 2 body edited

on:
  issues:
    types: [edited]

permissions:
  issues: write

concurrency:
  group: issue-2-status-sync
  cancel-in-progress: false

jobs:
  inspect-body-edit:
    if: ${{ github.event.issue.number == 2 && github.event.issue.pull_request == null && github.event.changes.body != null }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install HTML parser
        run: npm install --no-save --no-package-lock --prefix .github/scripts parse5@7.3.0
      - name: Synchronize Issue status and verify saved body
        run: node .github/scripts/issue-body-parser.js
