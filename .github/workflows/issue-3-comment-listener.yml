name: Issue 3 comment terminal
run-name: "Terminal · ${{ inputs.nonce }}"

on:
  workflow_dispatch:
    inputs:
      event_payload:
        description: Original issue_comment event JSON
        required: true
        type: string
      nonce:
        description: Command nonce or fallback comment identifier
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: issue-3-comment-terminal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_EVENT: ${{ inputs.event_payload }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dispatch comment and commit stdout lines
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const event = JSON.parse(process.env.ORIGINAL_EVENT);
          if (!["created", "edited"].includes(event.action) || event.issue?.number !== 3 || event.issue?.pull_request) throw new Error("Invalid routed Issue 3 event");
          const owner = event.repository?.owner;
          if (owner?.type !== "User" || owner.id !== event.comment?.user?.id || owner.login !== event.comment?.user?.login) throw new Error("Repository owner authorization failed");
          let input;
          try {
            input = JSON.parse(event.comment.body);
          } catch (err) {
            if (err instanceof SyntaxError) throw new Error("Issue comment must contain valid JSON: " + err.message);
            throw err;
          }
          if (input === null || typeof input !== "object" || Array.isArray(input)) {
            throw new Error("Expected a JSON object");
          }
          for (const key of ["runOn", "whatPrompt", "forWhom"]) {
            if (typeof input[key] !== "string" || !input[key].trim()) {
              throw new Error("Missing or invalid required field: " + key);
            }
          }
          if (!["$", "gh", "@"].includes(input.runOn)) {
            throw new Error('runOn must be "$", "gh", or "@"');
          }
          if (input.runOn === "@" && input.programInput !== undefined &&
              (input.programInput === null || typeof input.programInput !== "object" || Array.isArray(input.programInput))) {
            throw new Error("programInput must be a JSON object");
          }
          if (!/^[A-Za-z0-9_-]{1,128}$/.test(input.forWhom)) {
            throw new Error("forWhom must be a safe nonce (1–128 letters, numbers, _ or -)");
          }
          const repo = event.repository.full_name;
          const nonce = input.forWhom;
          const timestamp = new Date().toISOString().replace(/[-:.]/g, "");
          const resultPath = "workspaces/terminalruns/" + nonce + "_" + timestamp + ".json";
          const raw = input.whatPrompt.trim();
          let execution;
          if (input.runOn === "@") {
            if (raw !== "programs" && !/^run [a-z][a-z0-9-]{0,63}$/.test(raw)) {
              throw new Error('Program mode accepts "programs" or "run <application name>"');
            }
            const commandCommentId = event.comment?.id;
            if (!Number.isSafeInteger(commandCommentId) || commandCommentId <= 0) {
              throw new Error("Program mode requires a valid originating Issue #3 comment ID");
            }
            execution = spawnSync(process.execPath, [
              "workspaces/programs/runtime/program-mode.js",
              raw,
              JSON.stringify(input.programInput ?? {})
            ], {
              cwd: process.env.GITHUB_WORKSPACE,
              env: {
                ...process.env,
                TERMINALS_COMMAND_COMMENT_ID: String(commandCommentId),
                TERMINALS_AGENT_NONCE: nonce
              },
              encoding: "utf8",
              timeout: 300000,
              maxBuffer: 64 * 1024 * 1024
            });
          } else {
            const command = input.runOn === "$" ? input.whatPrompt : (
              /^gh(?:\s|$)/.test(raw) ? raw : "gh " + raw
            );
            execution = spawnSync("bash", ["-o", "pipefail", "-c", command], {
              cwd: process.env.GITHUB_WORKSPACE,
              env: process.env,
              encoding: "utf8",
              timeout: 300000,
              maxBuffer: 64 * 1024 * 1024
            });
          }
          const stdout = execution.stdout || "";
          const lines = stdout === "" ? [] : stdout.split(/\r?\n/);
          if (lines.length && lines[lines.length - 1] === "") lines.pop();
          const json = JSON.stringify({ inputThis: input.runOn + ":" + input.whatPrompt, outputThat: lines }, null, 2) + "\n";
          const outputPath = require("node:path").join(process.env.GITHUB_WORKSPACE, resultPath);
          fs.mkdirSync(require("node:path").dirname(outputPath), { recursive: true });
          fs.writeFileSync(outputPath, json, "utf8");
          
          const apiPath = "repos/" + repo + "/contents/" + resultPath;
          const message = "Save Issue #3 terminal stdout " + nonce + " (" + event.action + ")";
          function gh(args) {
            const response = spawnSync("gh", ["api", ...args], {
              cwd: process.env.GITHUB_WORKSPACE, env: process.env,
              encoding: "utf8", timeout: 30000, maxBuffer: 16 * 1024 * 1024
            });
            if (response.error || response.status !== 0) {
              throw new Error("GitHub API failed: " + (response.error?.message || response.stderr));
            }
            return JSON.parse(response.stdout);
          }
          function writeWithConflictRetry(args) {
            const maxAttempts = 12;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                return gh(args);
              } catch (error) {
                if (!/HTTP 409/.test(String(error)) || attempt === maxAttempts) throw error;
                const delay = Math.min(4000, 200 * 2 ** Math.min(attempt - 1, 4)) +
                  Math.floor(Math.random() * 300);
                console.log(JSON.stringify({resultPath, writeConflictRetry: attempt, delayMs: delay}));
                Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, delay);
              }
            }
          }
          const written = writeWithConflictRetry([apiPath, "--method", "PUT",
            "-f", "message=" + message,
            "-f", "content=" + Buffer.from(json, "utf8").toString("base64")]);
          const checked = gh([apiPath]);
          if (Buffer.from(checked.content.replace(/\s/g, ""), "base64").toString("utf8") !== json) {
            throw new Error("Read-back verification of stdout JSON failed");
          }
          console.log(JSON.stringify({
            resultPath, lineCount: lines.length, exitCode: execution.status,
            signal: execution.signal, commit: written.commit?.sha,
            stderr: execution.stderr || "", error: execution.error?.message || null
          }));
          if (execution.error || execution.status !== 0) process.exitCode = 1;
          NODE
