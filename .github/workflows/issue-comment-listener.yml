name: Repository issue comment listener

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Look up issue workflow registry by issue number
        id: registry
        run: |
          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const registry = JSON.parse(fs.readFileSync(".github/issue-workflow-registry.json", "utf8"));
          if (!registry || typeof registry !== "object" || Array.isArray(registry)) {
            throw new Error("Issue-workflow registry must be an object");
          }
          for (const [key, paths] of Object.entries(registry)) {
            if (!/^[1-9][0-9]*$/.test(key) ||
                !Number.isSafeInteger(Number(key)) ||
                !Array.isArray(paths) ||
                !paths.every(p => typeof p === "string" && p.startsWith(".github/workflows/") && /\.ya?ml$/.test(p))) {
              throw new Error("Invalid registry entry for issue " + key);
            }
          }
          const issueNumber = event.issue?.number;
          if (!Number.isSafeInteger(issueNumber)) throw new Error("Issue comment event missing issue number");
          const key = String(issueNumber);
          const matched = Object.hasOwn(registry, key);
          const workflows = matched ? registry[key] : [];
          const match = {issue_number: issueNumber, matched, key, workflows, action: event.action, comment_id: event.comment?.id};
          console.log(JSON.stringify(match));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            "matched=" + String(matched) + "\n" +
            "registry_key=" + key + "\n" +
            "workflow_paths=" + JSON.stringify(workflows) + "\n");
          NODE
