name: Legacy ChatGPT Shared Conversation Extraction (Forwarder)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public ChatGPT shared-conversation URL
        required: true
        type: string
      write_path:
        description: Optional run-specific repository output directory/template
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  extract:
    uses: ./.github/workflows/chatgpt-shared-conversation-extractor.yml
    with:
      target_url: ${{ inputs.target_url }}
      write_path: ${{ inputs.write_path }}
    permissions:
      contents: write
