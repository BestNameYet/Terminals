name: RuntimeConfig runtrigger

on:
  push:
    paths:
      - 'workspaces/RuntimeConfig/**/runtrigger.json'
      - '!workspaces/RuntimeConfig/runtrigger.json'

jobs:
  halt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save single changed runtrigger path
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          
          const before = process.env.BEFORE;
          const after = process.env.AFTER;
          const args = /^0+$/.test(before)
            ? ["ls-tree", "-r", "-z", "--name-only", after]
            : ["diff", "--name-only", "-z", "--diff-filter=ACMR", before, after, "--", "workspaces/RuntimeConfig"];
          
          const changed = execFileSync("git", args).toString("utf8").split("\0").filter(Boolean);
          const paths = changed.filter(file =>
            /^workspaces\/RuntimeConfig\/(?:[^/]+\/)+runtrigger\.json$/.test(file)
          );
          
          if (paths.length !== 1) {
            throw new Error("Expected exactly one changed nested runtrigger.json; found " + paths.length);
          }
          
          fs.appendFileSync(process.env.GITHUB_ENV, "RUNTRIGGER_PATH=" + paths[0] + "\n");
          console.log("Saved RUNTRIGGER_PATH=" + paths[0]);
          NODE

      - name: Parse runtrigger JSON
        run: node workspaces/RuntimeConfig/parse-json.js "$RUNTRIGGER_PATH"

      - name: Exit successfully
        run: exit 0
