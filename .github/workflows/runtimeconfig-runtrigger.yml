name: RuntimeConfig runtrigger

on:
  push:
    paths:
      - 'workspaces/RuntimeConfig/**/runtrigger.json'
      - '!workspaces/RuntimeConfig/runtrigger.json'

jobs:
  halt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save changed runtrigger paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          
          const before = process.env.BEFORE;
          const after = process.env.AFTER;
          const gitArgs = /^0+$/.test(before)
            ? ["ls-tree", "-r", "-z", "--name-only", after]
            : ["diff", "--name-only", "-z", before, after, "--", "workspaces/RuntimeConfig"];
          
          const changed = execFileSync("git", gitArgs)
            .toString("utf8").split("\0").filter(Boolean);
          
          const paths = changed.filter(file =>
            /^workspaces\/RuntimeConfig\/(?:[^/]+\/)+runtrigger\.json$/.test(file)
          );
          
          if (paths.length === 0) throw new Error("No changed subfolder runtrigger.json found.");
          
          fs.appendFileSync(process.env.GITHUB_ENV, "RUNTRIGGER_PATHS=" + JSON.stringify(paths) + "\n");
          if (paths.length === 1) {
            fs.appendFileSync(process.env.GITHUB_ENV, "RUNTRIGGER_PATH=" + paths[0] + "\n");
          }
          
          console.log("Saved runtrigger paths:", paths);
          NODE

      - name: Exit successfully
        run: exit 0
