<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer channel</title>
<style>
:root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 1px; }
main { border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 14px; padding: 16px; }
header, .toolbar, .composer-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
header { justify-content: space-between; }
h1 { margin: 0; font-size: 17px; }
#status, .hint, time, .meta { font-size: 12px; opacity: .78; }
a { color: LinkText; }
#messages { display: grid; gap: 8px; max-height: 24rem; min-height: 8rem; overflow: auto; margin: 14px 0; }
.message { border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 10px; padding: 10px; }
.message header { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.message p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
form { display: grid; gap: 8px; }
textarea, input, button { font: inherit; color: inherit; background: Canvas; border: 1px solid color-mix(in srgb, CanvasText 34%, Canvas); border-radius: 8px; padding: 8px; }
textarea { width: 100%; min-height: 66px; resize: vertical; }
input { width: 100%; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
#send { background: CanvasText; color: Canvas; padding-inline: 16px; margin-left: auto; }
.composer-actions { justify-content: space-between; }
</style>
<main>
  <header>
    <h1>Developer channel</h1>
    <span id="status" role="status">Connecting…</span>
  </header>
  <div class="toolbar">
    <a id="issue-link" href="https://github.com/BestNameYet/Terminals/issues/12" target="_blank" rel="noopener noreferrer">BestNameYet/Terminals · Issue #12</a>
    <span class="hint">No background polling. Load updates when needed.</span>
    <button type="button" id="refresh">Load updates</button>
  </div>
  <section id="messages" role="log" aria-label="Developer channel messages" aria-live="polite"></section>
  <form id="composer">
    <label for="participant-id">Target participant_id</label>
    <input id="participant-id" maxlength="128" pattern="[A-Za-z0-9][A-Za-z0-9._:-]{0,127}" required>
    <label for="comment-id">Target Issue #12 comment_id</label>
    <input id="comment-id" inputmode="numeric" pattern="[1-9][0-9]{0,19}" maxlength="20" required>
    <label for="draft">Update to append</label>
    <textarea id="draft" maxlength="5000" required placeholder="Write a channel update"></textarea>
    <div class="composer-actions">
      <span class="hint">Sending appends to the selected Issue #12 comment.</span>
      <button id="send" disabled>Send</button>
    </div>
  </form>
</main>
<script>
const status = document.querySelector('#status');
const messages = document.querySelector('#messages');
const issueLink = document.querySelector('#issue-link');
const form = document.querySelector('#composer');
const draft = document.querySelector('#draft');
const participantInput = document.querySelector('#participant-id');
const commentInput = document.querySelector('#comment-id');
const send = document.querySelector('#send');
const refreshButton = document.querySelector('#refresh');
const pending = new Map();
const events = new Map();
let requestId = 0;
let loading = false;
let cursor = '0';

try {
  participantInput.value = localStorage.getItem('terminals-channel-participant-id') || 'counterpart';
  commentInput.value = localStorage.getItem('terminals-channel-comment-id') || '6962337133';
} catch {
  participantInput.value = 'counterpart';
  commentInput.value = '6962337133';
}
function rememberRoute(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}
participantInput.addEventListener('change', () => rememberRoute('terminals-channel-participant-id', participantInput.value.trim()));
commentInput.addEventListener('change', () => rememberRoute('terminals-channel-comment-id', commentInput.value.trim()));

function notify(method, params) {
  window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
}

function call(method, params, timeout) {
  return new Promise((resolve, reject) => {
    const id = ++requestId;
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error('The host did not respond.'));
    }, timeout);
    pending.set(id, { resolve, reject, timer });
    window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
  });
}

window.addEventListener('message', ({ source, data }) => {
  if (source !== window.parent || data?.jsonrpc !== '2.0') return;
  const request = pending.get(data.id);
  if (!request) return;
  pending.delete(data.id);
  clearTimeout(request.timer);
  if (data.error) request.reject(new Error(data.error.message));
  else request.resolve(data.result);
});

async function callTool(name, args = {}) {
  const result = await call('tools/call', { name, arguments: args }, 30000);
  const content = result?.content?.find(item => item.type === 'text')?.text;
  let value = result?.structuredContent;
  if (!value && content) {
    try { value = JSON.parse(content); }
    catch { throw new Error(content); }
  }
  if (result.isError) throw new Error(value?.error || 'The channel request failed.');
  if (!value) throw new Error('The server returned no channel data.');
  return value;
}

function render(items) {
  const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 28;
  messages.replaceChildren();
  for (const item of items) {
    const article = document.createElement('article');
    article.className = 'message';
    const top = document.createElement('header');
    const author = document.createElement('strong');
    author.textContent = item.participant_id || 'channel update';
    const time = document.createElement('time');
    time.dateTime = item.created_at || '';
    time.textContent = item.created_at ? new Date(item.created_at).toLocaleString() : '';
    top.append(author, time);
    const body = document.createElement('p');
    body.textContent = item.message || item.body || '';
    article.append(top, body);
    messages.append(article);
  }
  if (atBottom) messages.scrollTop = messages.scrollHeight;
}

function applyResource(value) {
  if (!Array.isArray(value.events)) throw new Error('The resource response has no events array.');
  for (const event of value.events) events.set(String(event.cursor), event);
  cursor = String(value.cursor || cursor);
  render([...events.values()].sort((a, b) => Number(a.cursor) - Number(b.cursor)));
}

function routeArgs() {
  return {
    participant_id: participantInput.value.trim(),
    comment_id: commentInput.value.trim(),
    after_cursor: cursor
  };
}

async function refresh() {
  if (loading) return;
  loading = true;
  refreshButton.disabled = true;
  status.textContent = 'Reading the participant resource…';
  try {
    const result = await callTool('developer_channel_read', routeArgs());
    issueLink.href = 'https://github.com/BestNameYet/Terminals/issues/12#issuecomment-' + result.comment_id;
    issueLink.textContent = 'BestNameYet/Terminals · Issue #12 · ' + result.participant_id;
    applyResource(result);
    status.textContent = 'Loaded cursor ' + cursor;
  } catch (error) {
    status.textContent = 'Unavailable: ' + error.message;
  } finally {
    loading = false;
    refreshButton.disabled = false;
  }
}

refreshButton.addEventListener('click', () => refresh());

form.addEventListener('submit', async event => {
  event.preventDefault();
  const message = draft.value;
  if (!message.trim() || send.disabled) return;
  send.disabled = true;
  status.textContent = 'Appending update…';
  try {
    const result = await callTool('developer_channel_send', {
      participant_id: participantInput.value.trim(),
      comment_id: commentInput.value.trim(),
      message
    });
    applyResource(result);
    draft.value = '';
    status.textContent = 'Appended at cursor ' + cursor;
  } catch (error) {
    status.textContent = 'Send failed: ' + error.message;
  } finally {
    send.disabled = false;
  }
});

async function connect() {
  try {
    if (window.parent === window) throw new Error('Open this channel in ChatGPT.');
    await call('ui/initialize', {
      appInfo: { name: 'Developer channel', version: '1.0.0' },
      appCapabilities: {}, protocolVersion: '2026-01-26',
    }, 10000);
    notify('ui/notifications/initialized', {});
    send.disabled = false;
    await refresh();
  } catch (error) {
    status.textContent = 'Unavailable: ' + error.message;
  }
}
connect();
</script>
</html>
